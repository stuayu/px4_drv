[BonDriver]
Name="MyGica T230C ISDB-C (CATV)"
; スカパー！プレミアムサービス光 (J.83 Annex B) を受信する場合は、下の2つの System の行を入れ替え、DriverHost_PX4.ini で ExperimentalISDBC=true にする
System="ISDB-C"
;System="J.83B"
DriverHostPath=".\DriverHost_PX4.exe"
PipeConnectTimeout=1000
TuneTimeout=5000
NumberOfPacketsPerBuffer=1024
MaximumNumberOfBuffers=64
MinimumNumberOfBuffers=4
NumberOfBuffersToIgnoreAfterPurge=1
DisplayErrorMessage=0

[BonDriver.ISDB-C]
ChSetPath="BonDriver_T230C-C.ChSet.txt"

[BonDriver.J.83B]
ChSetPath="BonDriver_PX4-J83B.ChSet.txt"

[ReceiverDefinition0]
DeviceName="MyGica T230C"
DeviceGUID="{7c2ab781-65d8-4a51-bc5e-3af117612f2b}"
System="ISDB-C,J.83B"
